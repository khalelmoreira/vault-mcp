<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>project-vault chat</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    #log {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 1rem;
      height: 60vh;
      overflow-y: auto;
      margin-bottom: 1rem;
    }
    .msg { margin: 0 0 0.75rem; white-space: pre-wrap; }
    .msg.user b { color: #1a5fb4; }
    .msg.assistant b { color: #26a269; }
    form { display: flex; gap: 0.5rem; }
    input { flex: 1; padding: 0.5rem; font-size: 1rem; }
    button { padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <h1>project-vault chat</h1>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Ask about your vault..." />
    <button type="submit">Send</button>
  </form>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.innerHTML = `<b>${role === "user" ? "you" : "claude"}:</b> `;
      div.append(text);
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage("user", message);
      input.value = "";
      input.disabled = true;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        addMessage("assistant", data.reply);
      } catch (err) {
        addMessage("assistant", `(error: ${err.message})`);
      } finally {
        input.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
